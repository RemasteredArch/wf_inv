[package]
name = "wf_inv"
description = "scan a Warframe process to analyze inventory data"
version = "0.1.0"
authors = ["RemasteredArch"]
default-run = "wf_inv"

edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wf_inv_gui"
required-features = ["unstable-gui"]

[lints]
workspace = true

[features]
unstable-gui = ["dep:iced", "dep:iced_aw", "dep:tokio", "dep:rfd"]

[dependencies]
wf_inv_auth_scanning.workspace = true
wf_inv_price_data.workspace = true
anyhow.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
reqwest = { version = "0.13.1", features = ["blocking"] }
num-traits = "0.2.19"
serde.workspace = true
serde_json.workspace = true

# GUI crates.
iced = { version = "0.14.0", features = [
    "debug",
    "tokio",
    "advanced",
], optional = true }
tokio = { version = "1.48.0", features = ["time"], optional = true }
rfd = { version = "0.17.2", optional = true }
iced_aw = { version = "0.14.1", default-features = false, features = [
    "spinner",
], optional = true }

[workspace]
members = ["lib/*"]
resolver = "3"

package.edition = "2024"
package.publish = false
package.license = "MPL-2.0"
package.repository = "https://github.com/RemasteredArch/wf_inv"

[workspace.lints]
clippy.nursery = "warn"
clippy.pedantic = "warn"

[workspace.dependencies]
wf_inv_auth_scanning = { version = "*", path = "./lib/wf_inv_auth_scanning/" }
wf_inv_price_data = { version = "*", path = "./lib/wf_inv_price_data/" }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
